# Local development services only. The API and web app run directly on your
# machine (`pnpm dev`) — faster reloads and lighter on RAM.
#   pnpm db:up     start
#   pnpm db:down   stop (data is kept in the volume)
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockwise-postgres
    environment:
      POSTGRES_USER: stockwise
      POSTGRES_PASSWORD: stockwise
      POSTGRES_DB: stockwise
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockwise -d stockwise']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends (password resets, invitations).
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: stockwise-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:

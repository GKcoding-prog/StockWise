# Web container (apps/web/Dockerfile): serves the React build, forwards /api to the API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Product images and CSV imports.
  client_max_body_size 5m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same origin as the app, like Netlify's /api/* redirect in production.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Vite puts a content hash in every asset name, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other path is handled by the React router.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockwise
          POSTGRES_PASSWORD: stockwise
          POSTGRES_DB: stockwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockwise -d stockwise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://stockwise:stockwise@localhost:5432/stockwise
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (also generates the Prisma client)
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @stockwise/shared build

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm --filter @stockwise/api db:deploy

      - name: API tests against PostgreSQL
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
